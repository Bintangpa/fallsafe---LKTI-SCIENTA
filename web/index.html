<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FallSafe - Smart Real-Time Fall Monitoring System">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FallSafe">
  <link rel="apple-touch-icon" href="icons/Icon-512.png">

  <!-- Favicon Ultra HD -->
  <link rel="icon" type="image/png" sizes="512x512" href="favicon.png"/>
  <link rel="shortcut icon" href="favicon.png"/>

  <title>FallSafe - Monitoring Sensor</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F8FAFC;
      z-index: 999999;
      transition: opacity 0.4s ease;
    }
    .logo-box {
      width: 80px;
      height: 80px;
      background: #FFFFFF;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.15);
      border: 1px solid #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
    }
    .logo-box img {
      width: 52px;
      height: 52px;
      object-fit: contain;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #E2E8F0;
      border-top: 3px solid #2563EB;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      color: #0F172A;
      margin-top: 14px;
      letter-spacing: -0.2px;
    }
    .subtitle {
      font-size: 12px;
      color: #64748B;
      margin-top: 4px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="logo-box">
      <img src="favicon.png" alt="FallSafe">
    </div>
    <div class="spinner"></div>
    <div class="title">FallSafe</div>
    <div class="subtitle">Memuat sistem monitoring sensor...</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () { loader.remove(); }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
